<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Belajar JavaScript hari ke 17</title>
	</head>
	<body></body>
	<script>
		let angka = [2, 4, 6, 8];

		let hasil = angka
			.map((n) => n * 3)
			.filter((n) => n > 10)
			.reduce((a, b) => a - b);
		console.log(hasil);
	</script>
