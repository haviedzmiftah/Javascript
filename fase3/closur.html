<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function buatPengali(angka) {
        function pengali(x) {
          return x * angka;
        }
        return pengali;
      }

      let kali = buatPengali(2);
      let hasil = kali(5);

      console.log(hasil);
      console.log(hasil + 100);
    </script>
  </body>
</html>
